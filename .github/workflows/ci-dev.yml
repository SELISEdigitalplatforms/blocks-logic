name: CI - Dev
on:
  push:
    branches: [blocks-infra]

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: DOCKERFILE_CLIENT
          - component: worker
            dockerfile: DOCKERFILE_WORKER
    name: build-and-push (${{ matrix.component }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load repo variables (vars.env)
        run: cat .github/variables/vars.env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env[matrix.dockerfile] }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.AUTHOR }}/${{ env.REPO_NAME }}-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.REPO_NAME }}-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ env.REPO_NAME }}-${{ matrix.component }}

      - name: Summary
        run: |
          echo "Pushed \`${{ env.AUTHOR }}/${{ env.REPO_NAME }}-${{ matrix.component }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
